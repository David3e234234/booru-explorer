<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c28"/>
      <stop offset="100%" stop-color="#0c0e14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Background Rect with smooth corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Logo Icon -->
  <g transform="translate(106, 106) scale(12.5)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polygon points="12 2 2 7 12 12 22 7 12 2" stroke="url(#accentGrad)" stroke-width="2.2"/>
    <polyline points="2 17 12 22 22 17" stroke="url(#glowGrad)" stroke-width="2.2"/>
    <polyline points="2 12 12 17 22 12" stroke="url(#accentGrad)" stroke-width="2.2"/>
  </g>
</svg>
